<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'">
  <title>Design Atlas — Style Versus & Comparison Studio</title>
  <link rel="stylesheet" href="css/tailwind-compiled-compare.css">
  <script>
    /* Legacy runtime-compiler config — inert (and guarded) with the static compiled CSS; reactivates on a regeneration pass. */
    window.tailwind = window.tailwind || {};
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cinzel:wght@600;800&family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Space+Grotesk:wght@500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&family=VT323&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cinzel:wght@600;800&family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Space+Grotesk:wght@500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&family=VT323&display=swap"></noscript>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Shell v2 chrome layer (sub-page header/nav/plate) -->
  <link rel="stylesheet" href="css/shell-v2.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
  
  <header class="sv2-header sv2-standalone sticky top-0 z-40 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-2 font-black text-lg">
          <span class="w-8 h-8 rounded-lg bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white text-sm">DA</span>
          <span>Design Atlas</span>
        </a>
        <span class="text-xs px-2 py-0.5 rounded-full bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300 font-bold">Versus Mode</span>
      </div>
      <div class="sv2-subnav flex items-center gap-3 text-xs font-bold">
        <a href="index.html" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-home"></use></svg>  Main Gallery</a>
        <a href="playground.html" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-settings"></use></svg>  Playground</a>
        <a href="prompt-builder.html" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-type"></use></svg>  Prompt Studio</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
    <div id="compare-standalone"></div>
  </main>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-900 text-white border border-slate-700 shadow-2xl text-sm font-semibold">
    <span class="text-emerald-400">✔</span>
    <span id="toast-text">Success</span>
  </div>

  <script src="js/data.js"></script>
  <script src="js/util.js"></script>
  <script src="js/sw-register.js"></script>
  <script src="js/icon-sprite.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/compare.js"></script>
  <script>
    (function () {
      var stored = safeLS.get('theme', null);
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (stored === null && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
    const toastEl = document.getElementById("toast");
    const toastText = document.getElementById("toast-text");
    function showToast(msg) {
      toastText.textContent = msg;
      toastEl.classList.remove("translate-y-20", "opacity-0");
      setTimeout(() => toastEl.classList.add("translate-y-20", "opacity-0"), 2500);
    }
    function copyPrompt(text, name) {
      copyText(text).then(function (ok) {
        soundManager.play(ok ? 'success' : 'heavy');
        showToast(ok ? `Copied AI Prompt for ${name}!` : 'Copy blocked — select and press Ctrl+C');
      });
    }
    renderCompareView('compare-standalone', 'glassmorphism', 'neobrutalism');
  </script>
</body>
</html>
